<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>内置固定排版模板管理</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:#f5f6fa;color:#333}
.layout{display:flex;min-height:100vh}
.sidebar{width:220px;background:#1a1a2e;color:#fff;flex-shrink:0;display:flex;flex-direction:column}
.sidebar-header{padding:20px;border-bottom:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:10px}
.sidebar-header .logo{width:36px;height:36px;background:#4a6cf7;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:bold}
.sidebar-header .name{font-size:15px;font-weight:600}
.sidebar-nav{flex:1;padding:12px 0;overflow-y:auto}
.nav-group{padding:0 12px;margin-bottom:8px}
.nav-group-title{font-size:11px;color:rgba(255,255,255,.4);text-transform:uppercase;padding:8px 12px;letter-spacing:1px}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;color:rgba(255,255,255,.7);text-decoration:none;font-size:14px;transition:.2s;cursor:pointer;margin:2px 0}
.nav-item:hover{background:rgba(255,255,255,.08);color:#fff}
.nav-item.active{background:#4a6cf7;color:#fff}
.nav-item .icon{width:20px;text-align:center;font-size:15px}
.main{flex:1;overflow-y:auto}
.topbar{background:#fff;padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e8e8e8}
.topbar .breadcrumb{font-size:13px;color:#999}
.topbar .logout-btn{background:none;border:1px solid #ddd;padding:5px 14px;border-radius:6px;cursor:pointer;font-size:12px;color:#666;text-decoration:none;display:inline-block;line-height:normal}
.topbar .logout-btn:hover{background:#f5f5f5}
.content{padding:24px}
.page-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.page-head h2{font-size:20px;font-weight:700}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;border:none;cursor:pointer;font-size:13px;font-weight:600;transition:.15s}
.btn-primary{background:#4a6cf7;color:#fff}
.btn-primary:hover{background:#3a5be0}
.btn-ghost{background:#fff;border:1px solid #ddd;color:#555}
.btn-ghost:hover{background:#f5f5f5}
.btn-danger{background:#ef4444;color:#fff}
.btn-danger:hover{background:#dc2626}
.btn-sm{padding:5px 12px;font-size:12px}
.tpl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.tpl-card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06);display:flex;flex-direction:column}
.tpl-swatch{height:90px;display:flex;align-items:center;justify-content:center;position:relative}
.tpl-swatch .dot{width:34px;height:34px;border-radius:50%;box-shadow:0 4px 10px rgba(0,0,0,.18)}
.tpl-body{padding:12px 14px;flex:1}
.tpl-name{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.cat-tag{font-size:11px;padding:2px 8px;border-radius:20px;background:#eef2ff;color:#4a6cf7;font-weight:600}
.badge-off{font-size:11px;padding:2px 8px;border-radius:20px;background:#f3f4f6;color:#9ca3af;font-weight:600}
.tpl-desc{font-size:12px;color:#888;margin-top:6px;line-height:1.6;min-height:34px}
.tpl-actions{display:flex;gap:8px;padding:10px 14px;border-top:1px solid #f0f0f0}
.empty{text-align:center;color:#999;padding:60px;font-size:14px}
/* modal */
.mask{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:30px 16px;overflow:auto}
.mask.show{display:flex}
.modal{background:#fff;border-radius:14px;width:100%;max-width:1080px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid #f0f0f0}
.modal-head h3{font-size:17px;font-weight:700}
.modal-close{background:none;border:none;font-size:22px;cursor:pointer;color:#999;line-height:1}
.modal-body{display:grid;grid-template-columns:1fr 1fr;gap:18px;padding:18px 20px}
@media(max-width:900px){.modal-body{grid-template-columns:1fr}}
.form-col{display:flex;flex-direction:column;gap:12px}
.field label{display:block;font-size:12px;color:#666;margin-bottom:5px;font-weight:600}
.field input[type=text],.field textarea,.field select{width:100%;border:1px solid #dcdcdc;border-radius:8px;padding:8px 10px;font-size:13px;font-family:inherit}
.field textarea{resize:vertical;min-height:84px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;line-height:1.5}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.color-row{display:flex;align-items:center;gap:10px}
.color-row input[type=color]{width:42px;height:34px;border:1px solid #ddd;border-radius:6px;padding:2px;background:#fff;cursor:pointer}
.color-row input[type=text]{flex:1}
.switch{display:flex;align-items:center;gap:8px;font-size:13px;color:#555}
.preview-col{display:flex;flex-direction:column;gap:10px}
.preview-box{border:1px solid #e5e7eb;border-radius:10px;background:#fff;min-height:300px;max-height:520px;overflow:auto;padding:4px}
.preview-tip{font-size:12px;color:#999}
.hint{font-size:11px;color:#aaa;margin-top:4px}
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="logo">M</div>
      <div class="name">公众号管理</div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-group">
        <a class="nav-item" href="/admin" style="background:rgba(74,108,247,.15);color:#aab6ff;">
          <span class="icon">⇄</span> 切换系统
        </a>
      </div>
      <div class="nav-group">
        <div class="nav-group-title">公众号管理</div>
        <a class="nav-item" href="/admin/wechat"><span class="icon">◆</span> 概览</a>
        <a class="nav-item" href="/publish"><span class="icon">✎</span> 文章发布</a>
        <a class="nav-item" href="/template-editor"><span class="icon">🎨</span> 模板管理</a>
        <a class="nav-item" href="/admin/template-designer"><span class="icon">🧩</span> 可视化拖拽创作</a>
        <a class="nav-item active" href="/admin/builtin-templates"><span class="icon">📐</span> 内置模板管理</a>
        <a class="nav-item" href="/admin/generation-records"><span class="icon">📚</span> 生成记录</a>
        <a class="nav-item" href="/admin/publish-analytics"><span class="icon">📊</span> 发布数据分析</a>
      </div>
    </nav>
  </aside>
  <div class="main">
    <div class="topbar">
      <div class="breadcrumb">公众号管理 / 内置固定排版模板管理</div>
      <div class="user-info">
        <a href="/admin" class="logout-btn">切换系统</a>
        <button class="logout-btn" onclick="doLogout()">退出登录</button>
      </div>
    </div>
    <div class="content">
      <div class="page-head">
        <h2>内置固定排版模板</h2>
        <button class="btn btn-primary" onclick="openCreate()">＋ 新增模板</button>
      </div>
      <div class="tpl-grid" id="grid"><div class="empty">加载中...</div></div>
    </div>
  </div>
</div>

<!-- 编辑/新增弹窗 -->
<div class="mask" id="mask">
  <div class="modal">
    <div class="modal-head">
      <h3 id="modalTitle">新增模板</h3>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body">
      <div class="form-col">
        <div class="row2">
          <div class="field">
            <label>模板名称</label>
            <input type="text" id="f-name" placeholder="如：简约清新">
          </div>
          <div class="field">
            <label>分类</label>
            <input type="text" id="f-category" placeholder="通用 / 长文 / 党政 ...">
          </div>
        </div>
        <div class="field">
          <label>描述</label>
          <input type="text" id="f-desc" placeholder="一句话说明适用场景">
        </div>
        <div class="row2">
          <div class="field">
            <label>主色（标题/强调）</label>
            <div class="color-row">
              <input type="color" id="f-accent-color" oninput="document.getElementById('f-accent').value=this.value">
              <input type="text" id="f-accent" placeholder="#4a6cf7">
            </div>
          </div>
          <div class="field">
            <label>底色（卡片背景）</label>
            <div class="color-row">
              <input type="color" id="f-bg-color" oninput="document.getElementById('f-bg').value=this.value">
              <input type="text" id="f-bg" placeholder="#ffffff">
            </div>
          </div>
        </div>
        <div class="field">
          <label>风格配置 style_json</label>
          <textarea id="f-style" style="min-height:150px;"></textarea>
          <div class="hint">包含 body / h2 / quote / img 等键。示例见下方默认。</div>
        </div>
        <div class="field">
          <label>正文区样式 body_json</label>
          <textarea id="f-body" style="min-height:70px;"></textarea>
          <div class="hint">{"bg":"#ffffff","padding":"6px","extra":""}（extra 可补 border-radius 等）</div>
        </div>
        <div class="field">
          <label>头部 HTML（可选，如横幅/装饰）</label>
          <textarea id="f-header" placeholder="留空则无头部"></textarea>
        </div>
        <div class="field">
          <label>尾部 HTML（可选）</label>
          <textarea id="f-footer" placeholder="留空则无尾部"></textarea>
        </div>
        <label class="switch"><input type="checkbox" id="f-active" checked> 启用（前台可见可用）</label>
      </div>
      <div class="preview-col">
        <div class="preview-tip">实时预览（示例内容）：</div>
        <div class="preview-box" id="previewBox"><div style="padding:20px;color:#999;">点击「预览」查看效果</div></div>
        <div style="display:flex;gap:8px;">
          <button class="btn btn-ghost btn-sm" onclick="doPreview()">预览</button>
          <button class="btn btn-primary btn-sm" id="saveBtn" onclick="save()">保存</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const DEFAULT_STYLE = JSON.stringify({
  body: { color: "#374151", size: "15px", lh: "1.9" },
  h2: { deco: "bar", color: "#1e3a5f", accent: "#2563eb", size: "18px" },
  quote: { deco: "tint", color: "#1e40af", bg: "#eff6ff", accent: "#2563eb", italic: false },
  img: "max-width:100%;border-radius:8px;display:block;margin:0 auto;"
}, null, 2);
const DEFAULT_BODY = JSON.stringify({ bg: "#ffffff", padding: "6px", extra: "" }, null, 2);

let editingId = null;

function doLogout(){ fetch('/api/auth/logout',{method:'POST'}).then(()=>location.href='/login'); }

async function loadList(){
  const grid = document.getElementById('grid');
  try{
    const r = await fetch('/api/admin/builtin-templates');
    const d = await r.json();
    if(!d.success || !d.templates.length){ grid.innerHTML='<div class="empty">暂无模板，点击右上角新增</div>'; return; }
    grid.innerHTML = d.templates.map(t=>{
      const off = t.is_active ? '' : '<span class="badge-off">已停用</span>';
      return `<div class="tpl-card">
        <div class="tpl-swatch" style="background:${t.bg||'#fff'};">
          <div class="dot" style="background:${t.accent||'#888'};"></div>
        </div>
        <div class="tpl-body">
          <div class="tpl-name">${esc(t.name)} <span class="cat-tag">${esc(t.category||'通用')}</span> ${off}</div>
          <div class="tpl-desc">${esc(t.description||'')}</div>
        </div>
        <div class="tpl-actions">
          <button class="btn btn-ghost btn-sm" onclick="openEdit(${t.id})">编辑</button>
          <button class="btn btn-danger btn-sm" onclick="removeTpl(${t.id},'${esc(t.name)}')">删除</button>
        </div>
      </div>`;
    }).join('');
  }catch(e){ grid.innerHTML='<div class="empty">加载失败：'+e.message+'</div>'; }
}

function openCreate(){
  editingId = null;
  document.getElementById('modalTitle').textContent = '新增模板';
  document.getElementById('f-name').value='';
  document.getElementById('f-category').value='通用';
  document.getElementById('f-desc').value='';
  setColor('f-accent','f-accent-color','#4a6cf7');
  setColor('f-bg','f-bg-color','#ffffff');
  document.getElementById('f-style').value = DEFAULT_STYLE;
  document.getElementById('f-body').value = DEFAULT_BODY;
  document.getElementById('f-header').value='';
  document.getElementById('f-footer').value='';
  document.getElementById('f-active').checked = true;
  document.getElementById('previewBox').innerHTML='<div style="padding:20px;color:#999;">点击「预览」查看效果</div>';
  showModal();
}

async function openEdit(id){
  editingId = id;
  document.getElementById('modalTitle').textContent = '编辑模板 #'+id;
  const r = await fetch('/api/admin/builtin-templates/'+id);
  const d = await r.json();
  if(!d.success){ alert('读取失败：'+d.message); return; }
  const t = d.template;
  document.getElementById('f-name').value = t.name||'';
  document.getElementById('f-category').value = t.category||'通用';
  document.getElementById('f-desc').value = t.description||'';
  setColor('f-accent','f-accent-color', t.accent||'#4a6cf7');
  setColor('f-bg','f-bg-color', t.bg||'#ffffff');
  document.getElementById('f-style').value = t.style_json||DEFAULT_STYLE;
  document.getElementById('f-body').value = t.body_json||DEFAULT_BODY;
  document.getElementById('f-header').value = t.header_html||'';
  document.getElementById('f-footer').value = t.footer_html||'';
  document.getElementById('f-active').checked = !!t.is_active;
  showModal();
  doPreview();
}

function setColor(txtId, colorId, val){
  document.getElementById(txtId).value = val;
  document.getElementById(colorId).value = toHex(val);
}
function toHex(v){
  if(/^#[0-9a-fA-F]{6}$/.test(v)) return v;
  if(/^#[0-9a-fA-F]{3}$/.test(v)) return '#'+v[1]+v[1]+v[2]+v[2]+v[3]+v[3];
  return '#888888';
}

function showModal(){ document.getElementById('mask').classList.add('show'); }
function closeModal(){ document.getElementById('mask').classList.remove('show'); }
document.getElementById('mask').addEventListener('click', e=>{ if(e.target.id==='mask') closeModal(); });

async function doPreview(){
  const payload = collect();
  if(!payload) return;
  try{
    const r = await fetch('/api/admin/builtin-templates/preview',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    const d = await r.json();
    if(d.success){ document.getElementById('previewBox').innerHTML = d.html; }
    else { document.getElementById('previewBox').innerHTML = '<div style="padding:20px;color:#dc2626;">'+esc(d.message)+'</div>'; }
  }catch(e){ document.getElementById('previewBox').innerHTML='<div style="padding:20px;color:#dc2626;">预览失败：'+e.message+'</div>'; }
}

function collect(){
  let style, body;
  try{ style = JSON.parse(document.getElementById('f-style').value); }
  catch(e){ alert('风格配置 JSON 格式错误：'+e.message); return null; }
  try{ body = JSON.parse(document.getElementById('f-body').value); }
  catch(e){ alert('正文区样式 JSON 格式错误：'+e.message); return null; }
  return {
    name: document.getElementById('f-name').value.trim(),
    category: document.getElementById('f-category').value.trim() || '通用',
    description: document.getElementById('f-desc').value.trim(),
    accent: document.getElementById('f-accent').value.trim() || '#888888',
    bg: document.getElementById('f-bg').value.trim() || '#ffffff',
    style_json: JSON.stringify(style),
    body_json: JSON.stringify(body),
    header_html: document.getElementById('f-header').value,
    footer_html: document.getElementById('f-footer').value,
    is_active: document.getElementById('f-active').checked ? 1 : 0,
  };
}

async function save(){
  const payload = collect();
  if(!payload) return;
  if(!payload.name){ alert('请填写模板名称'); return; }
  try{
    let r, url, method;
    if(editingId){ url='/api/admin/builtin-templates/'+editingId; method='PUT'; }
    else { url='/api/admin/builtin-templates'; method='POST'; }
    r = await fetch(url,{method,headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    const d = await r.json();
    if(d.success){ closeModal(); loadList(); }
    else { alert('保存失败：'+d.message); }
  }catch(e){ alert('保存失败：'+e.message); }
}

async function removeTpl(id, name){
  if(!confirm('确定删除模板「'+name+'」？此操作不可恢复。')) return;
  try{
    const r = await fetch('/api/admin/builtin-templates/'+id,{method:'DELETE'});
    const d = await r.json();
    if(d.success){ loadList(); } else { alert('删除失败：'+d.message); }
  }catch(e){ alert('删除失败：'+e.message); }
}

function esc(s){ return (s||'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

loadList();
</script>
</body>
</html>
