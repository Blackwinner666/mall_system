<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>客户管理 - 百货商城</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:#f5f6fa;color:#333}
.layout{display:flex;min-height:100vh}
.sidebar{width:220px;background:#1a1a2e;color:#fff;flex-shrink:0}
.sidebar-header{padding:20px;border-bottom:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:10px}
.sidebar-header .logo{width:36px;height:36px;background:#4a6cf7;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:bold}
.sidebar-header .name{font-size:15px;font-weight:600}
.nav-group{padding:0 12px;margin-bottom:8px}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;color:rgba(255,255,255,.7);text-decoration:none;font-size:14px;transition:.2s;cursor:pointer;margin:2px 0}
.nav-item:hover{background:rgba(255,255,255,.08);color:#fff}
.nav-item.active{background:#4a6cf7;color:#fff}
.nav-item .icon{width:20px;text-align:center;font-size:15px}
.main{flex:1;overflow-y:auto}
.topbar{background:#fff;padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e8e8e8}
.topbar .breadcrumb{font-size:13px;color:#999}
.topbar .user-info{display:flex;align-items:center;gap:10px;font-size:13px}
.topbar .logout-btn{background:none;border:1px solid #ddd;padding:5px 14px;border-radius:6px;cursor:pointer;font-size:12px;color:#666}
.topbar .logout-btn:hover{background:#f5f5f5}
.content{padding:24px}
.toolbar{display:flex;gap:12px;margin-bottom:20px;align-items:center}
.toolbar input{height:36px;border:1px solid #ddd;border-radius:8px;padding:0 12px;font-size:13px;width:260px;outline:none}
.toolbar input:focus{border-color:#4a6cf7}
.panel{background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.06);overflow:hidden}
.panel-body{padding:20px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:12px 16px;font-size:13px;border-bottom:1px solid #f5f5f5}
th{background:#fafbfc;color:#666;font-weight:500;font-size:12px}
.customer-cell{display:flex;align-items:center;gap:10px}
.avatar-circle{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500;color:#fff;flex-shrink:0}
.avatar-0{background:#4a6cf7}.avatar-1{background:#10b981}.avatar-2{background:#f97316}.avatar-3{background:#8b5cf6}
.btn{padding:8px 20px;border-radius:8px;font-size:13px;font-weight:500;border:none;cursor:pointer;transition:.2s}
.btn-primary{background:#4a6cf7;color:#fff}
.btn-primary:hover{background:#3b5de7}
.btn-cancel{background:#f5f5f5;color:#666}
.btn-sm{padding:4px 10px;font-size:11px;border-radius:6px}
.btn-danger{background:#fef2f2;color:#dc2626}
.pagination{display:flex;justify-content:center;align-items:center;gap:8px;padding:16px;font-size:13px;color:#666}
.pagination button{height:32px;padding:0 12px;border:1px solid #e0e0e0;border-radius:6px;background:#fff;cursor:pointer;font-size:13px}
.pagination button:disabled{opacity:0.4;cursor:not-allowed}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.3);z-index:100;display:none;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:12px;width:480px;max-width:95vw;padding:28px}
.modal h3{font-size:16px;font-weight:600;margin-bottom:20px}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:13px;font-weight:500;color:#555;margin-bottom:6px}
.form-group input,.form-group textarea{width:100%;padding:8px 12px;border:1px solid #ddd;border-radius:8px;font-size:13px;outline:none;font-family:inherit}
.form-group input:focus,.form-group textarea:focus{border-color:#4a6cf7;box-shadow:0 0 0 3px rgba(74,108,247,.1)}
.form-group textarea{resize:vertical;min-height:60px}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
</style>
</head>
<body>
<div class="layout">
  <div class="sidebar" id="sidebar"></div>
  <div class="main">
    <div class="topbar">
      <div class="breadcrumb">客户管理</div>
      <div class="user-info">
        <span data-user-slot></span>
        <button class="logout-btn" onclick="doLogout()">退出</button>
      </div>
    </div>
    <div class="content">
      <div class="toolbar">
        <input type="text" id="searchInput" placeholder="搜索客户姓名/手机/邮箱..." oninput="loadCustomers()">
        <button class="btn btn-primary" onclick="showAddModal()">+ 添加客户</button>
      </div>
      <div class="panel">
        <div class="panel-body">
          <table><thead><tr><th>客户</th><th>手机</th><th>邮箱</th><th>城市</th><th>订单/消费</th><th>来源</th><th>添加时间</th><th>操作</th></tr></thead>
          <tbody id="tableBody"></tbody></table>
          <div class="pagination" id="pagination"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="customerModal">
  <div class="modal">
    <h3 id="modalTitle">添加客户</h3>
    <div class="form-group"><label>姓名 *</label><input type="text" id="cName" placeholder="请输入客户姓名"></div>
    <div class="form-group"><label>手机号 <span style="color:#dc2626">*</span></label><input type="text" id="cPhone" placeholder="请输入手机号（必填，用于登录）" maxlength="11"></div>
    <div class="form-group"><label>邮箱</label><input type="email" id="cEmail" placeholder="请输入邮箱"></div>
    <div class="form-group"><label>微信号</label><input type="text" id="cWechat" placeholder="请输入微信号"></div>
    <div class="form-group"><label>地址</label><input type="text" id="cAddress" placeholder="请输入地址"></div>
    <div class="form-group"><label>城市</label><input type="text" id="cCity" placeholder="请输入城市"></div>
    <div class="form-group"><label>备注</label><textarea id="cNotes" placeholder="备注信息..."></textarea></div>
    <div class="modal-actions">
      <button class="btn btn-cancel" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="saveCustomer()">保存</button>
    </div>
  </div>
</div>

<script>
let currentPage=1,editingId=null;
const colors=['avatar-0','avatar-1','avatar-2','avatar-3'];

function doLogout(){fetch('/api/auth/logout',{method:'POST'}).then(()=>location.href='/login');}

function renderSidebar(){
  document.getElementById('sidebar').innerHTML=`<div class="sidebar-header"><div class="logo">M</div><div class="name" id="storeName">百货商城</div></div>
    <nav style="padding:12px 0">
      <div class="nav-group"><a class="nav-item" href="/admin"><span class="icon">◆</span>首页</a></div>
      <div class="nav-group"><a class="nav-item" href="/admin/store"><span class="icon">◇</span>店铺管理</a></div>
      <div class="nav-group"><a class="nav-item" href="/admin/products"><span class="icon">☆</span>商品管理</a></div>
      <div class="nav-group"><a class="nav-item" href="/admin/orders"><span class="icon">☑</span>订单管理</a></div>
      <div class="nav-group"><a class="nav-item" href="/admin/after-sales"><span class="icon">↺</span>售后管理</a></div>
      <div class="nav-group"><a class="nav-item active" href="/admin/customers"><span class="icon">☺</span>客户管理</a></div>
      <div class="nav-group"><a class="nav-item" href="/admin/settings"><span class="icon">⚙</span>商城设置</a></div></nav>`;
}

async function init(){
  let r=await fetch('/api/auth/me');let u=await r.json();

  r=await fetch('/api/settings');let s=await r.json();
  if(s.success)document.getElementById('storeName').textContent=s.data.store_name||'百货商城';
}

async function loadCustomers(){
  const kw=document.getElementById('searchInput').value;
  const res=await fetch('/api/customers?page='+currentPage+'&keyword='+encodeURIComponent(kw));
  const json=await res.json();
  if(!json.success){window.location.href='/login';return;}
  document.getElementById('tableBody').innerHTML=json.data.items.map((c,i)=>
    '<tr><td><div class="customer-cell"><div class="avatar-circle '+colors[i%4]+'">'+(c.name||'?')[0]+'</div><div>'+c.name+'</div></div></td>'+
    '<td>'+(c.phone||'-')+'</td><td>'+(c.email||'-')+'</td><td>'+(c.city||'-')+'</td>'+
    '<td>'+c.total_orders+'单 / ¥'+(c.total_spent||0).toFixed(2)+'</td>'+
    '<td>'+(c.source||'-')+'</td><td>'+(c.created_at||'').substr(0,10)+'</td>'+
    '<td><button class="btn btn-cancel btn-sm" onclick="showEditModal('+c.id+')">编辑</button> <button class="btn btn-danger btn-sm" onclick="deleteC('+c.id+')">删除</button></td></tr>'
  ).join('');
  const tp=Math.ceil(json.data.total/json.data.per_page)||1;
  document.getElementById('pagination').innerHTML='<button '+(currentPage<=1?'disabled':'')+' onclick="goPage('+(currentPage-1)+')">上一页</button><span>'+currentPage+' / '+tp+'</span><button '+(currentPage>=tp?'disabled':'')+' onclick="goPage('+(currentPage+1)+')">下一页</button>';
}

function goPage(p){currentPage=p;loadCustomers();}

function showAddModal(){
  editingId=null;
  document.getElementById('modalTitle').textContent='添加客户';
  ['cName','cPhone','cEmail','cWechat','cAddress','cCity','cNotes'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('customerModal').classList.add('show');
}

function closeModal(){document.getElementById('customerModal').classList.remove('show');}

async function showEditModal(id){
  const res=await fetch('/api/customers?page=1&per_page=100');
  const json=await res.json();
  const c=json.data.items.find(x=>x.id===id);
  if(!c)return;
  editingId=id;
  document.getElementById('modalTitle').textContent='编辑客户';
  document.getElementById('cName').value=c.name;
  document.getElementById('cPhone').value=c.phone||'';
  document.getElementById('cEmail').value=c.email||'';
  document.getElementById('cWechat').value=c.wechat_id||'';
  document.getElementById('cAddress').value=c.address||'';
  document.getElementById('cCity').value=c.city||'';
  document.getElementById('cNotes').value=c.notes||'';
  document.getElementById('customerModal').classList.add('show');
}

async function saveCustomer(){
  const name=document.getElementById('cName').value.trim();
  const phone=document.getElementById('cPhone').value.trim();
  if(!name){alert('请输入客户姓名');return;}
  if(!phone){alert('手机号为必填项，客户需要通过手机号登录');return;}
  if(!/^1[3-9]\d{9}$/.test(phone)){alert('请输入正确的手机号');return;}
  const data={
    name,phone,email:document.getElementById('cEmail').value.trim(),
    email:document.getElementById('cEmail').value.trim(),
    wechat_id:document.getElementById('cWechat').value.trim(),
    address:document.getElementById('cAddress').value.trim(),
    city:document.getElementById('cCity').value.trim(),
    notes:document.getElementById('cNotes').value.trim()
  };
  const url=editingId?'/api/customers/'+editingId:'/api/customers';
  const res=await fetch(url,{method:editingId?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
  const json=await res.json();
  if(json.success){closeModal();loadCustomers();}else{alert(json.message);}
}

async function deleteC(id){if(!confirm('确定删除此客户？'))return;await fetch('/api/customers/'+id,{method:'DELETE'});loadCustomers();}

renderSidebar();init();loadCustomers();
</script>
<script src="/static/common_header.js"></script>
</body>
</html>
