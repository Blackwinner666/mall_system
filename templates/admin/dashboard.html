<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理后台 - 首页</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;background:#f5f6fa;color:#333}
.layout{display:flex;min-height:100vh}
.sidebar{width:220px;background:#1a1a2e;color:#fff;flex-shrink:0;display:flex;flex-direction:column}
.sidebar-header{padding:20px;border-bottom:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:10px}
.sidebar-header .logo{width:36px;height:36px;background:#4a6cf7;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:bold}
.sidebar-header .name{font-size:15px;font-weight:600}
.sidebar-nav{flex:1;padding:12px 0;overflow-y:auto}
.nav-group{padding:0 12px;margin-bottom:8px}
.nav-group-title{font-size:11px;color:rgba(255,255,255,.4);text-transform:uppercase;padding:8px 12px;letter-spacing:1px}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;color:rgba(255,255,255,.7);text-decoration:none;font-size:14px;transition:.2s;cursor:pointer;margin:2px 0}
.nav-item:hover{background:rgba(255,255,255,.08);color:#fff}
.nav-item.active{background:#4a6cf7;color:#fff}
.nav-item .icon{width:20px;text-align:center;font-size:15px}
.nav-item .badge{margin-left:auto;background:#e74c3c;color:#fff;font-size:11px;padding:2px 6px;border-radius:10px;min-width:18px;text-align:center}
.main{flex:1;overflow-y:auto}
.topbar{background:#fff;padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e8e8e8}
.topbar .breadcrumb{font-size:13px;color:#999}
.topbar .user-info{display:flex;align-items:center;gap:10px;font-size:13px}
.topbar .logout-btn{background:none;border:1px solid #ddd;padding:5px 14px;border-radius:6px;cursor:pointer;font-size:12px;color:#666}
.topbar .logout-btn:hover{background:#f5f5f5}
.content{padding:24px}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.stat-card{background:#fff;border-radius:12px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.06);display:flex;align-items:center;gap:16px}
.stat-icon{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.stat-icon.blue{background:#eef2ff;color:#4a6cf7}
.stat-icon.green{background:#ecfdf5;color:#10b981}
.stat-icon.orange{background:#fff7ed;color:#f97316}
.stat-icon.purple{background:#f5f3ff;color:#8b5cf6}
.stat-info .stat-value{font-size:24px;font-weight:700;color:#1a1a2e;line-height:1.2}
.stat-info .stat-label{font-size:13px;color:#999;margin-top:2px}
.stat-info .stat-sub{font-size:11px;color:#10b981;margin-top:2px}
.grid-2{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-bottom:24px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:24px}
.panel{background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.06);overflow:hidden}
.panel-header{padding:16px 20px;border-bottom:1px solid #f0f0f0;display:flex;align-items:center;justify-content:space-between}
.panel-header h3{font-size:15px;font-weight:600}
.panel-header .more{font-size:12px;color:#4a6cf7;cursor:pointer;text-decoration:none}
.panel-body{padding:16px 20px}
.chart-container{height:250px;position:relative}
.chart-bar{display:flex;align-items:flex-end;justify-content:space-around;height:100%;padding-top:20px}
.chart-col{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1}
.chart-bar-inner{display:flex;gap:4px;align-items:flex-end}
.chart-bar-item{width:18px;border-radius:4px 4px 0 0;transition:.3s;position:relative}
.chart-bar-item.pv{background:linear-gradient(180deg,#4a6cf7,#7b93fa)}
.chart-bar-item.order{background:linear-gradient(180deg,#10b981,#34d399)}
.chart-label{font-size:10px;color:#999}
.order-status-list{display:flex;flex-direction:column;gap:8px}
.status-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f5f5f5}
.status-item:last-child{border:none}
.status-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.status-dot.pending{background:#f59e0b}
.status-dot.paid{background:#3b82f6}
.status-dot.shipped{background:#8b5cf6}
.status-dot.completed{background:#10b981}
.status-dot.cancelled{background:#ef4444}
.status-item .status-name{flex:1;font-size:13px}
.status-item .status-count{font-size:15px;font-weight:600}
.data-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.data-item{text-align:center;padding:12px;background:#f8f9fc;border-radius:8px}
.data-item .data-val{font-size:20px;font-weight:700;color:#1a1a2e}
.data-item .data-lbl{font-size:11px;color:#999;margin-top:4px}
.data-item .data-val.green{color:#10b981}
.list-item{display:flex;align-items:center;padding:8px 0;border-bottom:1px solid #f5f5f5;gap:12px;font-size:13px}
.list-item:last-child{border:none}
.list-item .li-title{flex:1}
.list-item .li-status{padding:2px 8px;border-radius:4px;font-size:11px;font-weight:500}
.li-status.published{background:#ecfdf5;color:#10b981}
.li-status.draft{background:#f3f4f6;color:#6b7280}
.li-status.pinned{background:#fef3c7;color:#d97706}
.list-item .li-time{color:#999;font-size:11px}
.announce-row{display:flex;align-items:center;justify-content:space-between;padding:6px 0;font-size:13px}
.announce-row .pin-icon{color:#f59e0b;margin-right:6px}
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.4);z-index:1000;display:flex;align-items:center;justify-content:center}
.modal{background:#fff;border-radius:16px;width:600px;max-height:80vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.15)}
.modal-header{padding:16px 24px;border-bottom:1px solid #f0f0f0;display:flex;align-items:center;justify-content:space-between}
.modal-header h3{font-size:16px;font-weight:600}
.modal-close{width:32px;height:32px;border:none;background:#f5f5f5;border-radius:8px;cursor:pointer;font-size:18px;line-height:1;color:#999}
.modal-body{padding:20px 24px}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:13px;font-weight:500;color:#555;margin-bottom:6px}
.form-group input,.form-group textarea,.form-group select{width:100%;padding:8px 12px;border:1px solid #ddd;border-radius:8px;font-size:13px;outline:none;transition:.2s}
.form-group input:focus,.form-group textarea:focus,.form-group select:focus{border-color:#4a6cf7;box-shadow:0 0 0 3px rgba(74,108,247,.1)}
.form-group textarea{resize:vertical;min-height:80px}
.form-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
.btn{padding:8px 20px;border-radius:8px;font-size:13px;font-weight:500;border:none;cursor:pointer;transition:.2s}
.btn-primary{background:#4a6cf7;color:#fff}
.btn-primary:hover{background:#3b5de7}
.btn-cancel{background:#f5f5f5;color:#666}
.btn-cancel:hover{background:#eee}
.btn-sm{padding:4px 10px;font-size:11px;border-radius:6px}
.btn-danger{background:#fef2f2;color:#dc2626}
.btn-danger:hover{background:#fee2e2}
.btn-success{background:#ecfdf5;color:#059669}
.btn-success:hover{background:#d1fae5}
.loading{text-align:center;padding:40px;color:#999}
.act-card{display:flex;gap:12px;padding:12px;background:#f8f9fc;border-radius:8px;margin-bottom:8px}
.act-card .act-img{width:60px;height:60px;border-radius:8px;background:#e8e8e8;flex-shrink:0;overflow:hidden}
.act-card .act-img img{width:100%;height:100%;object-fit:cover}
.act-info{flex:1}
.act-info .act-title{font-size:13px;font-weight:500;margin-bottom:4px}
.act-info .act-time{font-size:11px;color:#999}
.act-status{font-size:11px;padding:2px 6px;border-radius:4px}
.act-status.active{background:#ecfdf5;color:#10b981}
.act-status.ended{background:#f3f4f6;color:#6b7280}
.flex-between{display:flex;align-items:center;justify-content:space-between}
.mt-3{margin-top:12px}
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <div class="topbar">
      <div class="breadcrumb">商城管理 / 数据概览</div>
      <div class="user-info">
        <a href="/admin" class="logout-btn" style="text-decoration:none;display:inline-block;line-height:normal;">切换系统</a>
        <a href="/portal" class="logout-btn" style="text-decoration:none;display:inline-block;line-height:normal;">工作台</a>
        <span data-user-slot></span>
        <button class="logout-btn" onclick="doLogout()">退出登录</button>
      </div>
    </div>
    <div class="content" id="app">
      <div class="loading">加载中...</div>
    </div>
  </div>
</div>

<script>
// ====== 侧边栏 ======
function renderSidebar() {
  document.getElementById('sidebar').innerHTML = `
    <div class="sidebar-header">
      <div class="logo">M</div>
      <div class="name" id="storeName">百货商城</div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-group">
        <a class="nav-item" href="/admin" style="background:rgba(74,108,247,.15);color:#aab6ff;">
          <span class="icon">⇄</span> 切换系统
        </a>
      </div>
      <div class="nav-group">
        <div class="nav-group-title">商城管理</div>
        <a class="nav-item active" href="/admin/mall">
          <span class="icon">◆</span> 数据概览
        </a>
        <a class="nav-item" href="/admin/store">
          <span class="icon">◇</span> 店铺管理
        </a>
        <a class="nav-item" href="/admin/products">
          <span class="icon">☆</span> 商品管理
        </a>
        <a class="nav-item" href="/admin/orders">
          <span class="icon">☑</span> 订单管理
        </a>
        <a class="nav-item" href="/admin/after-sales">
          <span class="icon">↺</span> 售后管理
        </a>
        <a class="nav-item" href="/admin/customers">
          <span class="icon">☺</span> 客户管理
        </a>
      </div>
      <div class="nav-group">
        <a class="nav-item" href="/admin/settings">
          <span class="icon">⚙</span> 商城设置
        </a>
      </div>
    </nav>`;
}

// ====== 初始化 ======
async function init() {
  renderSidebar();
  try {
    let r = await fetch('/api/auth/me');
    let u = await r.json();

    r = await fetch('/api/settings');
    let s = await r.json();
    if (s.success && s.data.store_name) document.getElementById('storeName').textContent = s.data.store_name;
  } catch(e) {}
  await loadDashboard();
}

function doLogout() {
  fetch('/api/auth/logout', {method:'POST'}).then(() => location.href='/login');
}

// ====== Dashboard ======
async function loadDashboard() {
  let app = document.getElementById('app');
  try {
    let r = await fetch('/api/admin/analytics');
    let d = (await r.json()).data;
    let anns = await fetch('/api/admin/announcements').then(r=>r.json());
    let acts = await fetch('/api/admin/activities').then(r=>r.json());

    let html = '';

    // Stats Row
    html += `<div class="stats-row">
      <div class="stat-card"><div class="stat-icon blue">👁</div><div class="stat-info"><div class="stat-value">${d.pv_today}</div><div class="stat-label">今日访问(PV)</div><div class="stat-sub">UV ${d.uv_today}</div></div></div>
      <div class="stat-card"><div class="stat-icon green">📦</div><div class="stat-info"><div class="stat-value">${d.orders_today}</div><div class="stat-label">今日订单</div><div class="stat-sub">营收 ¥${d.revenue_today.toFixed(2)}</div></div></div>
      <div class="stat-card"><div class="stat-icon orange">🏪</div><div class="stat-info"><div class="stat-value">${d.active_products}/${d.total_products}</div><div class="stat-label">在售/总商品</div><div class="stat-sub">${d.total_customers} 位客户</div></div></div>
      <div class="stat-card"><div class="stat-icon purple">💰</div><div class="stat-info"><div class="stat-value">¥${d.total_revenue.toFixed(2)}</div><div class="stat-label">累计营收</div><div class="stat-sub">待处理售后 ${d.pending_after_sales}</div></div></div>
    </div>`;

    // 7-day trend chart + Order status
    html += `<div class="grid-2">
      <div class="panel">
        <div class="panel-header"><h3>近7天趋势</h3></div>
        <div class="panel-body"><div class="chart-container"><div class="chart-bar" id="chart7">`;

    let maxVal = 1;
    d.recent_7days.forEach(v => { maxVal = Math.max(maxVal, v.pv, v.orders); });

    d.recent_7days.forEach(v => {
      let pvH = Math.max(4, (v.pv / maxVal) * 160);
      let ordH = Math.max(4, (v.orders / maxVal) * 160);
      html += `<div class="chart-col">
        <div class="chart-bar-inner">
          <div class="chart-bar-item pv" style="height:${pvH}px" title="PV: ${v.pv}"></div>
          <div class="chart-bar-item order" style="height:${ordH}px" title="订单: ${v.orders}"></div>
        </div>
        <div class="chart-label">${v.date}</div>
      </div>`;
    });

    html += `</div></div>
        <div style="display:flex;gap:20px;justify-content:center;padding:8px 0;font-size:11px;color:#999">
          <span><span style="display:inline-block;width:10px;height:10px;background:#4a6cf7;border-radius:2px;vertical-align:middle;margin-right:4px"></span>访问量</span>
          <span><span style="display:inline-block;width:10px;height:10px;background:#10b981;border-radius:2px;vertical-align:middle;margin-right:4px"></span>订单数</span>
        </div></div>
      </div>
      <div class="panel">
        <div class="panel-header"><h3>订单状态分布</h3></div>
        <div class="panel-body"><div class="order-status-list">`;

    d.order_status.forEach(s => {
      html += `<div class="status-item">
        <div class="status-dot ${s.status}"></div>
        <div class="status-name">${s.label}</div>
        <div class="status-count">${s.count}</div>
      </div>`;
    });

    html += `</div></div></div></div>`;

    // Weekly / Monthly data + Latest orders + Announcements/Activities
    html += `<div class="grid-3">
      <div class="panel">
        <div class="panel-header"><h3>经营数据</h3></div>
        <div class="panel-body">
          <div class="data-grid">
            <div class="data-item"><div class="data-val">${d.orders_week}</div><div class="data-lbl">本周订单</div></div>
            <div class="data-item"><div class="data-val green">¥${d.revenue_week.toFixed(2)}</div><div class="data-lbl">本周营收</div></div>
            <div class="data-item"><div class="data-val">${d.orders_month}</div><div class="data-lbl">本月订单</div></div>
            <div class="data-item"><div class="data-val green">¥${d.revenue_month.toFixed(2)}</div><div class="data-lbl">本月营收</div></div>
          </div>
        </div>
      </div>
      <div class="panel">
        <div class="panel-header"><h3>最新订单</h3></div>
        <div class="panel-body">`;

    d.latest_orders.forEach(o => {
      let sl = {'pending_payment':'待付款','paid':'已付款','shipped':'已发货','completed':'已完成','cancelled':'已取消'};
      let sc = {'pending_payment':'pending','paid':'paid','shipped':'shipped','completed':'completed','cancelled':'cancelled'};
      html += `<div class="list-item">
        <span class="li-title">${o.order_no} · ${o.customer}</span>
        <span class="li-status ${sc[o.status]}">${sl[o.status]}</span>
        <span class="li-time">¥${o.amount.toFixed(2)}</span>
      </div>`;
    });

    html += `</div></div>
      <div class="panel">
        <div class="panel-header"><h3>公告</h3><span class="more" onclick="showAnnounceModal()">+ 发布</span></div>
        <div class="panel-body">`;

    if (anns.success && anns.data.length > 0) {
      anns.data.slice(0, 5).forEach(a => {
        html += `<div class="announce-row">
          <span>${a.is_pinned ? '<span class="pin-icon">📌</span>' : ''}${a.title}</span>
          <span style="font-size:11px;color:#999">${a.created_at ? a.created_at.slice(0,10) : ''}</span>
        </div>`;
      });
    } else {
      html += '<div style="text-align:center;color:#999;padding:20px">暂无公告</div>';
    }

    html += `</div></div></div>`;

    // Platform Activities
    html += `<div class="panel" style="margin-bottom:24px">
      <div class="panel-header"><h3>平台活动</h3><span class="more" onclick="showActivityModal()">+ 新建活动</span></div>
      <div class="panel-body" style="display:flex;gap:16px;flex-wrap:wrap">`;

    if (acts.success && acts.data.length > 0) {
      acts.data.forEach(a => {
        html += `<div class="act-card" style="flex:1;min-width:250px">
          <div class="act-img">${a.banner_image ? '<img src="'+a.banner_image+'" />' : '🎉'}</div>
          <div class="act-info">
            <div class="act-title">${a.title}</div>
            <div class="act-time">${a.start_time || '未设置'} ~ ${a.end_time || '未设置'}</div>
            <div style="margin-top:4px"><span class="act-status ${a.status}">${a.status==='active'?'进行中':'已结束'}</span></div>
          </div>
        </div>`;
      });
    } else {
      html += '<div style="text-align:center;color:#999;padding:20px;width:100%">暂无活动</div>';
    }

    html += `</div></div>`;

    app.innerHTML = html;
  } catch(e) {
    app.innerHTML = '<div class="loading">加载失败: ' + e.message + '</div>';
  }
}

// ====== 公告弹窗 ======
function showAnnounceModal(id) {
  let isEdit = !!id;
  let overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `<div class="modal">
    <div class="modal-header"><h3>${isEdit?'编辑':'发布'}公告</h3><button class="modal-close" onclick="this.closest('.modal-overlay').remove()">×</button></div>
    <div class="modal-body">
      <div class="form-group"><label>标题</label><input id="annTitle" placeholder="请输入公告标题" /></div>
      <div class="form-group"><label>内容</label><textarea id="annContent" placeholder="请输入公告内容"></textarea></div>
      <div class="form-group"><label><input type="checkbox" id="annPinned" /> 置顶</label></div>
      <div class="form-group"><label>状态</label><select id="annStatus"><option value="published">已发布</option><option value="draft">草稿</option></select></div>
      <div class="form-actions">
        <button class="btn btn-cancel" onclick="this.closest('.modal-overlay').remove()">取消</button>
        <button class="btn btn-primary" id="annSave">${isEdit?'保存':'发布'}</button>
      </div>
    </div>
  </div>`;
  document.body.appendChild(overlay);

  document.getElementById('annSave').onclick = async () => {
    let data = {
      title: document.getElementById('annTitle').value,
      content: document.getElementById('annContent').value,
      is_pinned: document.getElementById('annPinned').checked,
      status: document.getElementById('annStatus').value
    };
    let url = '/api/admin/announcements';
    let method = 'POST';
    if (isEdit) { url += '/' + id; method = 'PUT'; }
    let r = await fetch(url, {method, headers:{'Content-Type':'application/json'}, body:JSON.stringify(data)});
    let j = await r.json();
    if (j.success) { overlay.remove(); loadDashboard(); }
    else alert(j.message);
  };
}

// ====== 活动弹窗 ======
function showActivityModal(id) {
  let isEdit = !!id;
  let overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `<div class="modal">
    <div class="modal-header"><h3>${isEdit?'编辑':'新建'}活动</h3><button class="modal-close" onclick="this.closest('.modal-overlay').remove()">×</button></div>
    <div class="modal-body">
      <div class="form-group"><label>活动标题</label><input id="actTitle" /></div>
      <div class="form-group"><label>活动描述</label><textarea id="actDesc"></textarea></div>
      <div class="form-group"><label>Banner图片(URL)</label><input id="actBanner" /></div>
      <div class="form-group" style="display:flex;gap:12px">
        <div style="flex:1"><label>开始时间</label><input type="datetime-local" id="actStart" /></div>
        <div style="flex:1"><label>结束时间</label><input type="datetime-local" id="actEnd" /></div>
      </div>
      <div class="form-actions">
        <button class="btn btn-cancel" onclick="this.closest('.modal-overlay').remove()">取消</button>
        <button class="btn btn-primary" id="actSave">${isEdit?'保存':'创建'}</button>
      </div>
    </div>
  </div>`;
  document.body.appendChild(overlay);

  document.getElementById('actSave').onclick = async () => {
    let data = {
      title: document.getElementById('actTitle').value,
      description: document.getElementById('actDesc').value,
      banner_image: document.getElementById('actBanner').value,
      start_time: document.getElementById('actStart').value,
      end_time: document.getElementById('actEnd').value
    };
    let url = '/api/admin/activities';
    let method = 'POST';
    if (isEdit) { url += '/' + id; method = 'PUT'; }
    let r = await fetch(url, {method, headers:{'Content-Type':'application/json'}, body:JSON.stringify(data)});
    let j = await r.json();
    if (j.success) { overlay.remove(); loadDashboard(); }
    else alert(j.message);
  };
}

init();
</script>
