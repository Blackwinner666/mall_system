<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>百货商城</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif; background: #f5f5f5; color: #333; }

.header { background: #fff; border-bottom: 1px solid #f0f0f0; position: sticky; top: 0; z-index: 50; }
.header-inner { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; height: 56px; }
.header-left { display: flex; align-items: center; gap: 10px; }
.header-logo { width: 36px; height: 36px; border-radius: 8px; background: #eeedfe; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.header-logo img { width: 100%; height: 100%; object-fit: cover; }
.header-logo svg { width: 22px; height: 22px; fill: #534ab7; }
.header-title { font-size: 16px; font-weight: 600; color: #1a1a1a; }
.header-right { display: flex; align-items: center; gap: 12px; }
.header-btn { padding: 6px 16px; border-radius: 6px; font-size: 13px; cursor: pointer; border: 1px solid #e0e0e0; background: #fff; color: #666; transition: all .15s; text-decoration: none; }
.header-btn:hover { border-color: #534ab7; color: #534ab7; }
.header-btn.primary { background: #534ab7; color: #fff; border-color: #534ab7; }

.banner { background: linear-gradient(135deg, #534ab7 0%, #7f77dd 100%); color: #fff; padding: 48px 16px; text-align: center; }
.banner h1 { font-size: 28px; font-weight: 600; margin-bottom: 8px; }
.banner p { font-size: 14px; opacity: 0.85; max-width: 500px; margin: 0 auto; }
.search-bar { max-width: 500px; margin: 24px auto 0; position: relative; }
.search-bar input { width: 100%; height: 44px; border: none; border-radius: 22px; padding: 0 20px 0 44px; font-size: 14px; color: #333; outline: none; }
.search-bar .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 18px; color: #ccc; }

.main { max-width: 1200px; margin: 0 auto; padding: 24px 16px; }
.categories { display: flex; gap: 0; margin-bottom: 24px; background: #fff; border-radius: 10px; overflow: hidden; border: 1px solid #f0f0f0; flex-wrap: wrap; }
.cat-item { flex: 1; min-width: 80px; text-align: center; padding: 14px 8px; cursor: pointer; font-size: 13px; color: #666; transition: all .15s; border-right: 1px solid #f5f5f5; }
.cat-item:last-child { border-right: none; }
.cat-item:hover { color: #534ab7; background: #fafafa; }
.cat-item.active { color: #534ab7; font-weight: 500; background: #eeedfe; }

.products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
.product-card { background: #fff; border-radius: 10px; overflow: hidden; border: 1px solid #f0f0f0; cursor: pointer; transition: all .2s; }
.product-card:hover { transform: translateY(-2px); box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
.product-img { width: 100%; height: 220px; background: #fafafa; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
.product-img img { width: 100%; height: 100%; object-fit: cover; }
.product-img .no-img { font-size: 48px; color: #e0e0e0; }
.product-img .sales-badge { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.5); color: #fff; padding: 2px 8px; border-radius: 4px; font-size: 11px; }
.product-info { padding: 12px; }
.product-name { font-size: 14px; font-weight: 500; color: #1a1a1a; margin-bottom: 8px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.4; }
.product-price-row { display: flex; align-items: baseline; gap: 6px; }
.product-price { font-size: 18px; font-weight: 600; color: #e24b4a; }
.product-price .symbol { font-size: 13px; }
.product-orig-price { font-size: 12px; color: #ccc; text-decoration: line-through; }
.product-sold { font-size: 11px; color: #bbb; margin-top: 4px; }
.empty-state { grid-column: 1 / -1; text-align: center; padding: 60px 20px; color: #ccc; font-size: 14px; }

.footer { background: #fff; border-top: 1px solid #f0f0f0; padding: 32px 16px; text-align: center; color: #bbb; font-size: 12px; margin-top: 40px; }

.detail-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4); z-index: 100; display: none; align-items: center; justify-content: center; }
.detail-overlay.show { display: flex; }
.detail-modal { background: #fff; border-radius: 12px; width: 480px; max-width: 95vw; max-height: 85vh; overflow-y: auto; position: relative; }
.detail-close { position: absolute; top: 12px; right: 12px; width: 32px; height: 32px; border-radius: 50%; background: rgba(0,0,0,0.3); color: #fff; border: none; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; z-index: 2; }
.detail-images { width: 100%; height: 320px; background: #f5f5f5; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.detail-images img { width: 100%; height: 100%; object-fit: cover; }
.detail-images .no-img { font-size: 64px; color: #e0e0e0; }
.detail-body { padding: 20px; }
.detail-name { font-size: 18px; font-weight: 600; color: #1a1a1a; margin-bottom: 12px; }
.detail-price-row { display: flex; align-items: baseline; gap: 8px; margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px solid #f0f0f0; }
.detail-price { font-size: 24px; font-weight: 600; color: #e24b4a; }
.detail-price .symbol { font-size: 16px; }
.detail-orig { font-size: 14px; color: #ccc; text-decoration: line-through; }
.detail-meta { display: flex; gap: 24px; font-size: 12px; color: #999; margin-bottom: 16px; }
.detail-desc { font-size: 13px; color: #666; line-height: 1.6; white-space: pre-wrap; }
.detail-actions { padding: 16px 20px; border-top: 1px solid #f0f0f0; display: flex; gap: 10px; }
.btn { height: 40px; padding: 0 20px; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; font-weight: 500; flex: 1; }
.btn-buy { background: #534ab7; color: #fff; }
.btn-buy:hover { background: #3c3489; }
.btn-cart { background: #fff; color: #534ab7; border: 1px solid #534ab7; }

.login-toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #1a1a1a; color: #fff; padding: 10px 24px; border-radius: 8px; font-size: 13px; z-index: 200; display: none; }
.login-toast.show { display: block; }
</style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <div class="header-left">
      <div class="header-logo" id="headerLogo">
        <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 14H4V6h16v12zM6 10h2v2H6zm4 0h2v2h-2zm4 0h2v2h-2z"/></svg>
      </div>
      <span class="header-title" id="headerTitle">百货商城</span>
    </div>
    <div class="header-right" id="headerRight">
      <a href="/login" class="header-btn">登录</a>
    </div>
  </div>
</div>

<div class="banner" id="bannerSection">
  <h1 id="bannerTitle">品质百货，一站购齐</h1>
  <p id="bannerDesc">精选好物，品质生活</p>
  <div class="search-bar">
    <span class="search-icon">&#128269;</span>
    <input type="text" id="searchInput" placeholder="搜索商品..." oninput="loadProducts()">
  </div>
</div>

<div class="main">
  <div class="categories" id="categoriesRow"></div>
  <div class="products-grid" id="productsGrid"></div>
</div>

<div class="footer" id="footerInfo">百货商城</div>

<div class="detail-overlay" id="detailOverlay">
  <div class="detail-modal">
    <button class="detail-close" onclick="closeDetail()">&times;</button>
    <div class="detail-images" id="detailImage"></div>
    <div class="detail-body">
      <div class="detail-name" id="detailName"></div>
      <div class="detail-price-row">
        <span class="detail-price"><span class="symbol">¥</span><span id="detailPrice"></span></span>
        <span class="detail-orig" id="detailOrig"></span>
      </div>
      <div class="detail-meta">
        <span>库存: <span id="detailStock"></span></span>
        <span>已售: <span id="detailSales"></span></span>
        <span id="detailCat"></span>
      </div>
      <div class="detail-desc" id="detailDesc"></div>
    </div>
    <div class="detail-actions">
      <button class="btn btn-buy" onclick="showToast('支付接口预留，敬请期待')">立即购买</button>
    </div>
  </div>
</div>

<div class="login-toast" id="toast"></div>

<script>
let currentCategory = '';
let currentProducts = [];

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

function doLogout() {
  fetch('/api/auth/logout', {method:'POST'}).then(() => location.reload());
}

async function init() {
  // 检查登录状态
  const meRes = await fetch('/api/auth/me'); const meJson = await meRes.json();
  const headerRight = document.getElementById('headerRight');
  if (meJson.success && meJson.logged_in) {
    const u = meJson.user;
    headerRight.innerHTML = '<a href="/portal" class="header-btn" style="background:#eeedfe;color:#534ab7;border-color:#534ab7;font-weight:500;">工作台</a>' +
      '<a href="/publish" class="header-btn" style="background:#eeedfe;color:#534ab7;border-color:#534ab7;font-weight:500;">AI创作发布</a>' +
      '<a href="/cart" class="header-btn" style="position:relative">&#128722; 购物车</a>' +
      '<a href="/profile" class="header-btn">个人中心</a>' +
      '<span style="font-size:13px;color:#333;font-weight:500;">' + u.display_name + '</span>' +
      '<button class="header-btn" onclick="doLogout()">退出</button>';
  } else {
    headerRight.innerHTML = '<a href="/publish" class="header-btn" style="background:#eeedfe;color:#534ab7;border-color:#534ab7;font-weight:500;">AI创作发布</a><a href="/login" class="header-btn">登录</a>';
  }

  const res = await fetch('/api/settings'); const json = await res.json();
  if (json.success && json.data) {
    const d = json.data;
    document.getElementById('headerTitle').textContent = d.store_name || '百货商城';
    document.getElementById('bannerTitle').textContent = d.store_name || '品质百货，一站购齐';
    document.getElementById('bannerDesc').textContent = d.store_description || '';
    document.getElementById('footerInfo').textContent = d.store_name || '百货商城';
    if (d.store_logo) {
      document.getElementById('headerLogo').innerHTML = '<img src="' + d.store_logo + '" alt="logo">';
    }
    document.title = d.store_name || '百货商城';
  }

  const catRes = await fetch('/api/categories'); const catJson = await catRes.json();
  if (catJson.success) {
    const cats = catJson.data;
    let html = '<div class="cat-item active" onclick="selectCategory(this, \'\')">全部</div>';
    cats.forEach(c => { html += '<div class="cat-item" onclick="selectCategory(this, ' + c.id + ')">' + c.name + '</div>'; });
    document.getElementById('categoriesRow').innerHTML = html;
  }
  loadProducts();
}

function selectCategory(el, id) {
  currentCategory = id;
  document.querySelectorAll('.cat-item').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  loadProducts();
}

async function loadProducts() {
  const kw = document.getElementById('searchInput') ? document.getElementById('searchInput').value : '';
  let url = '/api/products?per_page=50&status=active';
  if (currentCategory) url += '&category_id=' + currentCategory;
  if (kw) url += '&keyword=' + encodeURIComponent(kw);

  const res = await fetch(url); const json = await res.json();
  currentProducts = json.success ? json.data.items : [];

  const grid = document.getElementById('productsGrid');
  if (currentProducts.length === 0) {
    grid.innerHTML = '<div class="empty-state">暂无商品</div>';
    return;
  }
  grid.innerHTML = currentProducts.map(p => {
    const img = (p.images && p.images.length > 0) ? ('<img src="' + p.images[0] + '" alt="' + p.name + '">') : ('<span class="no-img">&#128247;</span>');
    const salesBadge = p.sales_count > 0 ? '<div class="sales-badge">已售 ' + p.sales_count + '</div>' : '';
    const origPrice = p.original_price ? '<span class="product-orig-price">¥' + p.original_price.toFixed(2) + '</span>' : '';
    return '<div class="product-card" onclick="location.href=\'/product/' + p.id + '\'">' +
      '<div class="product-img">' + img + salesBadge + '</div>' +
      '<div class="product-info">' +
        '<div class="product-name">' + p.name + '</div>' +
        '<div class="product-price-row"><span class="product-price"><span class="symbol">¥</span>' + p.price.toFixed(2) + '</span>' + origPrice + '</div>' +
        '<div class="product-sold">' + (p.sales_count > 0 ? '已售 ' + p.sales_count + '件' : '') + '</div>' +
      '</div></div>';
  }).join('');
}

function showDetail(id) {
  const p = currentProducts.find(x => x.id === id);
  if (!p) return;
  const img = (p.images && p.images.length > 0) ? ('<img src="' + p.images[0] + '" alt="' + p.name + '">') : ('<span class="no-img">&#128247;</span>');
  document.getElementById('detailImage').innerHTML = img;
  document.getElementById('detailName').textContent = p.name;
  document.getElementById('detailPrice').textContent = p.price.toFixed(2);
  document.getElementById('detailOrig').innerHTML = p.original_price ? '¥' + p.original_price.toFixed(2) : '';
  document.getElementById('detailStock').textContent = p.stock;
  document.getElementById('detailSales').textContent = p.sales_count + '件';
  document.getElementById('detailCat').textContent = p.category_name || '';
  document.getElementById('detailDesc').textContent = p.description || '暂无描述';
  document.getElementById('detailOverlay').classList.add('show');
}

function closeDetail() { document.getElementById('detailOverlay').classList.remove('show'); }

document.getElementById('detailOverlay').addEventListener('click', function(e) {
  if (e.target === this) closeDetail();
});

init();
</script>
</body>
</html>
