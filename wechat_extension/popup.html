<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; width: 300px; padding: 16px; margin: 0; color: #222; }
    h3 { margin: 0 0 8px; font-size: 15px; }
    p { font-size: 12px; color: #666; line-height: 1.5; margin: 0 0 12px; }
    button { width: 100%; padding: 11px; border: 0; border-radius: 8px; background: #1d9e75; color: #fff; font-size: 14px; cursor: pointer; }
    button:active { opacity: .85; }
    .tip { margin-top: 10px; font-size: 11px; color: #999; line-height: 1.5; }
  </style>
</head>
<body>
  <h3>公众号一键粘贴助手</h3>
  <p>把剪贴板里的富样式文章粘贴到当前公众号编辑器（保留背景/边框/圆角）。</p>
  <button id="go">粘贴到公众号</button>
  <div class="tip">使用步骤：① 在发布系统点「复制到微信」 → ② 打开公众号图文编辑器 → ③ 点此按钮（或编辑器右下角浮标）。</div>
  <script src="popup.js"></script>
</body>
</html>
